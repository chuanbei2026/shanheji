<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九朝题签 · 山河纪</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e7;color:#526148;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.page{max-width:1100px;margin:auto;padding:32px 36px 25px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d9dccd;padding-bottom:18px}h1{font:28px 'Songti SC',STSong,serif;letter-spacing:4px;margin:0}header small{display:block;margin-top:8px;color:#9a927e;letter-spacing:2px;font-size:9px}a{color:#8f795c;text-decoration:none;font-size:11px}.intro{font-size:11px;color:#8f9984;line-height:1.9;margin:15px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{height:198px;background:linear-gradient(135deg,#fffdf6,#f5f0e3);border:1px solid #dedbcf;border-radius:6px;display:grid;grid-template-columns:1fr 90px;align-items:center;padding:16px 24px;box-shadow:0 3px 9px #46543a04}.tile img,.tile svg{display:block;width:140px;height:140px;object-fit:contain;mix-blend-mode:multiply}.tile h2{font:22px 'Songti SC',STSong,serif;margin:0 0 9px}.tile p{font-size:10px;line-height:1.9;color:#9b8c72;margin:0 0 13px}.tile a{font-size:9px;color:#a0a58f}.foot{font-size:10px;line-height:1.9;color:#9da38e;margin-top:20px}@media(max-width:800px){.page{padding:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:10px;height:170px;grid-template-columns:minmax(0,1fr) 75px}.tile img,.tile svg{width:110px;height:110px}}@media(max-width:470px){.grid{grid-template-columns:1fr}}</style></head><body><main class="page"><header><div><h1>九朝题签 · 以书体辨时代</h1><small>山河纪 / DYNASTIES IN INK</small></div><a href="./?year=1137">返回历史地图 ↗</a></header><p class="intro">秦篆、汉隶与历代书迹笔意，成为一组朝代的视觉题签。图像为当代艺术化创作，非古代原件或原帖集字；每朝也并非只使用一种书体。</p><div id="grid" class="grid"></div><p class="foot">题签已用于地图页眉与左侧帝系卡片。点击卡片题签可查看代表书迹与借鉴依据，正文及皇帝名单保留清晰的现代字形。</p></main><script src="dynasty-lettering.js?v=colored-ink-1"></script><script>Promise.all(['dynasty-lettering.json','dynasty-colors.json'].map(p=>fetch(p).then(r=>r.json()))).then(([d,palette])=>{const grid=document.getElementById('grid');for(const e of d.entries){const article=document.createElement('article');article.className='tile';const img=document.createElement('div');const tone=palette.dynasties.find(c=>c.key===e.label);img.innerHTML=DynastyLettering.picture(e,'gallery-lettering',tone?.displayHex||tone?.hex);const text=document.createElement('div'),name=document.createElement('h2'),style=document.createElement('p'),link=document.createElement('a');name.textContent=e.label;style.textContent=e.style;link.textContent='借鉴依据 ↗';link.href=e.source.url;link.target='_blank';link.rel='noopener';text.append(name,style,link);article.append(img,text);grid.append(article);}});</script></body></html>
